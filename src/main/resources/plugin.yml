name: MyPlugin
version: 1.0
main: com.aporia.Main
api-version: '1.21'
description: Example Plugin

commands:
  stats:
    description: 플레이어의 스텟을 보여줌
    usage: /stats

  exp:
    description: 경험치 명령어
    usage: /exp
    permission: aporia.admin

  spawnmob:
    description: 몬스터 소환 명령어
    usage: /spawnmob <monsterId>
    permission: aporia.admin

  getitem:
   description: 아이템 생성 명령어
   usage: /getitem <itemId>
   permission: aporia.admin

  craft:
   description: 아이템 제작 명령어
   usage: /craft <recipeId>

  givematerial:
   description: 재료 지급 명령어
   usage: /givematerial <materialId> <count>
   permission: aporia.admin

  gold:
    description: 골드 조회 및 관리 명령어
    usage: /gold <add|remove|set|check> <player> [amount]

permissions:
  aporia.admin:
    description: Aporia 관리자 명령어 권한
    default: op